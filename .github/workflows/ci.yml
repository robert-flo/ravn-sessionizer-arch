name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (.SRCINFO + ShellCheck)
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      # git antes del checkout: sin git, actions/checkout baja un tarball sin .git
      # y `git diff --check` de make lint falla.
      - name: Herramientas
        run: pacman -Syu --noconfirm --needed git shellcheck make jq
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder --shell /bin/bash --command "cd '$GITHUB_WORKSPACE' && git config --global --add safe.directory '$GITHUB_WORKSPACE' && make lint"
      - name: Automatización upstream (offline)
        run: tests/test-upstream-automation.sh

  package:
    name: Contrato de empaquetado (offline)
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      # git antes del checkout: sin git, actions/checkout baja un tarball sin .git
      # y los fixtures del test no pueden construir historial.
      - name: Herramientas
        run: pacman -Syu --noconfirm --needed git shellcheck make jq tar
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # El tarball vendoreado se retiró: el paquete lo genera package.yml con
      # git archive del sha despachado y el contrato de ese workflow se
      # verifica offline acá. El build+install real vive en package.yml
      # (repository_dispatch del despacho o workflow_dispatch post-merge).
      - name: Contrato del empaquetado al vuelo
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder --shell /bin/bash --command "cd '$GITHUB_WORKSPACE' && tests/test-package-workflow.sh"
